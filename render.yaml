# Blueprint do Render para o backend (Fase 7 — deploy público).
#
# Como usar: Render → New → Blueprint → aponte para este repositório. O Render lê
# este arquivo e cria o serviço já configurado; só as variáveis marcadas com
# `sync: false` precisam ser preenchidas à mão no painel (são segredos, e por isso
# não moram no git).
#
# Notas do free tier:
#   - o serviço hiberna após ~15 min sem tráfego; a 1ª requisição leva ~30-60s
#     (o frontend avisa o visitante — ver `useApiWaking`);
#   - por isso a ingestão semanal NÃO depende deste processo: quem dispara é o
#     GitHub Actions (`.github/workflows/ingest.yml`), com ANP_CRON=off aqui.

services:
  - type: web
    name: price-tracker-pro-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # `--include=dev` é obrigatório aqui: como definimos NODE_ENV=production (o
    # backend precisa disso em runtime para o fail-closed do requireAuth), o npm
    # omitiria as devDependencies no build — e o TypeScript é uma delas, então o
    # `npm run build` falharia com "tsc: not found". As devDeps só existem na
    # etapa de build; o que roda em produção continua sendo o `dist/` compilado.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production # liga o fail-closed do requireAuth

      - key: NODE_VERSION
        value: "22"

      # Origens liberadas no CORS. Aceita lista separada por vírgula
      # (produção + previews da Vercel). Preencher após o deploy do frontend.
      - key: FRONTEND_URL
        sync: false

      # Cron embutido desligado: a ingestão semanal roda no GitHub Actions, que
      # não depende deste processo estar acordado.
      - key: ANP_CRON
        value: "off"

      # Retenção automática (Fase 9): mantém o banco no platô do free tier.
      - key: RETENTION_MONTHS
        value: "12"

      # ── Segredos (preencher no painel do Render) ──────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # SMTP dos alertas — opcional: sem isso o email é apenas logado.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

      # ── Mercado Pago (checkout Pix) ───────────────────────────────────────
      # Sem estas quatro o backend sobe normal, mas com a cobrança DESLIGADA:
      # `getMercadoPagoConfig()` devolve null e o POST /api/billing/checkout
      # responde 503. Declaradas aqui para o blueprint não esconder a
      # dependência — os valores continuam sendo preenchidos no painel.
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      # ⚠️ "test" ou "production", e a escolha é manual de propósito. Os dois
      # tokens começam com APP_USR e são idênticos a olho; esta bandeira é a
      # única coisa que distingue "cobra dinheiro real" de "não cobra". Com
      # NODE_ENV=production (definido acima) o valor "test" faz o config
      # recusar a cobrança no boot — que é o comportamento desejado enquanto
      # as credenciais de produção não entram. Ver docs/runbook-operacao.md §1.
      - key: MERCADOPAGO_ENV
        sync: false
      # Só existe depois de cadastrar a URL pública do webhook no painel. Hoje
      # é lida e não valida nada — a validação x-signature é pendência aberta.
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false

      # E-mails autorizados nas rotas de estorno (lista separada por vírgula).
      # Sem ela ninguém é admin e as rotas respondem 503 — fail-closed de
      # propósito: env incompleta não pode virar rota pública que devolve
      # dinheiro. Ver backend/src/middleware/requireAdmin.ts.
      - key: ADMIN_EMAILS
        sync: false
